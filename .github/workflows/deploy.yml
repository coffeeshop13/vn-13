name: Deploy to Yandex Cloud S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
          SOURCE_DIR: out

      - name: Publish slashless route objects
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          while IFS= read -r page; do
            route="${page#out/}"
            route="${route%/index.html}"
            if [ -n "$route" ]; then
              case "$route" in
                404|_not-found) continue ;;
              esac
              aws s3 cp "$page" "s3://${AWS_S3_BUCKET}/${route}" \
                --endpoint-url "${AWS_S3_ENDPOINT}" \
                --content-type text/html \
                --cache-control 'public,max-age=0,must-revalidate' \
                --no-progress
            fi
          done < <(find out -mindepth 2 -type f -name index.html | sort)

      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: b74b59f1575a383a6a86c059d4e3c9bc
        run: |
          node <<'NODE'
          const fs = require('fs')
          const sitemap = fs.readFileSync('out/sitemap.xml', 'utf8')
          const urls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1])
          fs.writeFileSync('/tmp/vn13-indexnow.json', JSON.stringify({
            host: 'vn-13.com',
            key: process.env.INDEXNOW_KEY,
            keyLocation: `https://vn-13.com/${process.env.INDEXNOW_KEY}.txt`,
            urlList: [...new Set(urls)],
          }))
          NODE
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/vn13-indexnow.json
