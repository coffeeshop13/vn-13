name: Deploy Next.js to Yandex S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Next.js Static Export
        run: |
          sed -i 's/const nextConfig: NextConfig = {/const nextConfig: NextConfig = { output: "export", images: { unoptimized: true },/' next.config.ts

      - name: Build Project
        run: npm run build

      # Настраиваем официальный инструмент AWS CLI для Яндекса
      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.YC_S3_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.YC_S3_SECRET_KEY }}
          aws configure set default.region ru-central1

      # Загружаем файлы напрямую через консольную команду Яндекса
      - name: Upload Files to Bucket
        run: |
          aws --endpoint-url=https://yandexcloud.net s3 sync ./out s3://://vn-13.com --acl public-read
