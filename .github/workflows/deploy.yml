name: Deploy to Yandex Cloud S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate optimized portfolio card images
        run: node scripts/generate-seo-card-images.mjs

      - name: Build
        run: npm run build

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
          SOURCE_DIR: out

      - name: Set immutable cache headers for versioned Next.js assets
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          aws s3 cp out/_next/static/ "s3://${AWS_S3_BUCKET}/_next/static/" \
            --recursive \
            --endpoint-url "${AWS_S3_ENDPOINT}" \
            --cache-control 'public,max-age=31536000,immutable' \
            --no-progress

      - name: Set cache headers for public media assets
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          aws s3 cp out/ "s3://${AWS_S3_BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.avif" \
            --include "*.gif" \
            --include "*.ico" \
            --include "*.jpeg" \
            --include "*.jpg" \
            --include "*.png" \
            --include "*.svg" \
            --include "*.webp" \
            --include "*.woff" \
            --include "*.woff2" \
            --endpoint-url "${AWS_S3_ENDPOINT}" \
            --cache-control 'public,max-age=86400,stale-while-revalidate=604800' \
            --no-progress

      - name: Set cache headers for HTML and SEO files
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          while IFS= read -r page; do
            key="${page#out/}"
            case "$page" in
              *.html) content_type="text/html" ;;
              */robots.txt) content_type="text/plain" ;;
              */sitemap.xml) content_type="application/xml" ;;
            esac
            aws s3 cp "$page" "s3://${AWS_S3_BUCKET}/${key}" \
              --endpoint-url "${AWS_S3_ENDPOINT}" \
              --content-type "${content_type}" \
              --cache-control 'public,max-age=300,stale-while-revalidate=86400' \
              --no-progress
          done < <(find out -type f \( -name '*.html' -o -name 'robots.txt' -o -name 'sitemap.xml' \) | sort)

      - name: Publish slashless route objects
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          while IFS= read -r page; do
            route="${page#out/}"
            route="${route%/index.html}"
            if [ -n "$route" ]; then
              case "$route" in
                404|_not-found) continue ;;
              esac
              aws s3 cp "$page" "s3://${AWS_S3_BUCKET}/${route}" \
                --endpoint-url "${AWS_S3_ENDPOINT}" \
                --content-type text/html \
                --cache-control 'public,max-age=300,stale-while-revalidate=86400' \
                --no-progress
            fi
          done < <(find out -mindepth 2 -type f -name index.html | sort)

      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: b74b59f1575a383a6a86c059d4e3c9bc
        run: |
          node <<'NODE'
          const fs = require('fs')
          const sitemap = fs.readFileSync('out/sitemap.xml', 'utf8')
          const urls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1])
          fs.writeFileSync('/tmp/vn13-indexnow.json', JSON.stringify({
            host: 'vn-13.com',
            key: process.env.INDEXNOW_KEY,
            keyLocation: `https://vn-13.com/${process.env.INDEXNOW_KEY}.txt`,
            urlList: [...new Set(urls)],
          }))
          NODE
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/vn13-indexnow.json
