name: Deploy to Yandex Cloud S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate optimized portfolio card images
        run: node scripts/generate-seo-card-images.mjs

      - name: Build
        run: npm run build

      - name: Deploy to S3
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          aws s3 sync out/ "s3://${AWS_S3_BUCKET}/" \
            --endpoint-url "${AWS_S3_ENDPOINT}" \
            --delete \
            --exclude "_next/static/*"

      - name: Set immutable cache headers for versioned Next.js assets
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          aws s3 cp out/_next/static/ "s3://${AWS_S3_BUCKET}/_next/static/" \
            --recursive \
            --endpoint-url "${AWS_S3_ENDPOINT}" \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Set cache headers for public media assets
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          aws s3 cp out/ "s3://${AWS_S3_BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.avif" \
            --include "*.gif" \
            --include "*.ico" \
            --include "*.jpeg" \
            --include "*.jpg" \
            --include "*.png" \
            --include "*.svg" \
            --include "*.webp" \
            --include "*.woff" \
            --include "*.woff2" \
            --endpoint-url "${AWS_S3_ENDPOINT}" \
            --cache-control 'public,max-age=86400,stale-while-revalidate=604800'

      - name: Set long-lived cache headers for versioned media assets
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          for asset in \
            'hero-vn13-showroom-768-v20260913.webp' \
            'brands/aequamente-lookbook/aequamente-card-v20260913-q70.webp' \
            'brands/real/manuelle-guibal-card-v20260913-q70.webp' \
            'brands/shoto/shoto-card-v20260913-q70.webp' \
            'brands/hannoh-lookbook/hannoh-card-v20260913-q70.webp' \
            'brands/moyuru-card-v20260913-q70.webp' \
            'brands/post-and-co/belt-collection-card-v20260913-q70.webp' \
            'brands/vn13-catalog/vn13-designer-womenswear-collection-hero-v20260913-640.webp' \
            'brands/vn13-catalog/vn13-designer-womenswear-collection-hero-v20260913-1000.webp' \
            'brands/vn13-catalog/vn13-blue-floral-designer-dress-card-v20260913-400.webp' \
            'brands/vn13-catalog/vn13-blue-floral-designer-dress-card-v20260913-800.webp' \
            'brands/vn13-catalog/vn13-black-textured-designer-coat-card-v20260913-400.webp' \
            'brands/vn13-catalog/vn13-black-textured-designer-coat-card-v20260913-800.webp' \
            'brands/vn13-catalog/vn13-black-jacket-white-layered-dress-card-v20260913-400.webp' \
            'brands/vn13-catalog/vn13-black-jacket-white-layered-dress-card-v20260913-800.webp' \
            'brands/vn13-catalog/vn13-white-oversize-designer-shirt-card-v20260913-400.webp' \
            'brands/vn13-catalog/vn13-white-oversize-designer-shirt-card-v20260913-800.webp'; do
            aws s3 cp "out/${asset}" "s3://${AWS_S3_BUCKET}/${asset}" \
              --endpoint-url "${AWS_S3_ENDPOINT}" \
              --cache-control 'public,max-age=31536000,immutable'
          done

      - name: Set cache headers for HTML and SEO files
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          aws s3 cp out/ "s3://${AWS_S3_BUCKET}/" --recursive --exclude "*" --include "*.html" --endpoint-url "${AWS_S3_ENDPOINT}" --content-type "text/html" --cache-control 'public,max-age=300,must-revalidate'

          while IFS= read -r page; do
            key="${page#out/}"
            case "$page" in
              *.html) content_type="text/html" ;;
              */robots.txt) content_type="text/plain" ;;
              */sitemap.xml|*/sitemap_index.xml) content_type="application/xml" ;;
            esac
            aws s3 cp "$page" "s3://${AWS_S3_BUCKET}/${key}" \
              --endpoint-url "${AWS_S3_ENDPOINT}" \
              --content-type "${content_type}" \
              --cache-control 'public,max-age=300,must-revalidate'
          done < <(find out -type f \( -name 'robots.txt' -o -name 'sitemap.xml' -o -name 'sitemap_index.xml' \) | sort)

      - name: Apply legacy object redirects
        env:
          AWS_S3_BUCKET: vn-13.com
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_REGION: ru-central1
        run: |
          set -euo pipefail
          while IFS='|' read -r key destination; do
            aws s3api put-object \
              --bucket "${AWS_S3_BUCKET}" \
              --key "${key}" \
              --endpoint-url "${AWS_S3_ENDPOINT}" \
              --body /dev/null \
              --content-type 'text/html' \
              --cache-control 'public,max-age=300,must-revalidate' \
              --website-redirect-location "https://vn-13.com${destination}"
          done <<'REDIRECTS'
          hannoh-wessel/index.html|/brands/hannoh-wessel/
          post-co/index.html|/brands/post-and-co/
          priveh/index.html|/contact/
          sula/index.html|/brands/sula/
          vn-13-fashion-agency/index.html|/
          2023/12/17/главные-тренды-мировой-индустрии-мод/index.html|/journal/
          REDIRECTS

      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: b74b59f1575a383a6a86c059d4e3c9bc
        run: |
          node <<'NODE'
          const fs = require('fs')
          const sitemap = fs.readFileSync('out/sitemap.xml', 'utf8')
          const urls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1])
          fs.writeFileSync('/tmp/vn13-indexnow.json', JSON.stringify({
            host: 'vn-13.com',
            key: process.env.INDEXNOW_KEY,
            keyLocation: `https://vn-13.com/${process.env.INDEXNOW_KEY}.txt`,
            urlList: [...new Set(urls)],
          }))
          NODE
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/vn13-indexnow.json

      - name: Verify live SEO surface
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --silent --show-error --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$1"
          }
          homepage="$(fetch https://vn-13.com/)"
          sitemap="$(fetch https://vn-13.com/sitemap.xml)"
          robots="$(fetch https://vn-13.com/robots.txt)"
          grep -F '<link rel="canonical" href="https://vn-13.com/"' <<< "${homepage}"
          grep -F '<title>' <<< "${homepage}"
          grep -F '<loc>https://vn-13.com/' <<< "${sitemap}"
          grep -F 'Sitemap: https://vn-13.com/sitemap.xml' <<< "${robots}"

          asset_path="$(grep -oE '/_next/static/[^" ]+\.(css|js)' <<< "${homepage}" | head -n 1)"
          test -n "${asset_path}"
          asset_headers="$(curl --fail --silent --show-error --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 -D - -o /dev/null "https://vn-13.com${asset_path}")"
          grep -Eiq '^HTTP/[^ ]+ 200|^HTTP/[^ ]+ 2[0-9][0-9]' <<< "${asset_headers}"
          grep -Eiq '^content-type: text/(css|javascript)' <<< "${asset_headers}"
          grep -Eiq '^cache-control:.*max-age=31536000' <<< "${asset_headers}"
          node scripts/verify-live-seo.mjs
